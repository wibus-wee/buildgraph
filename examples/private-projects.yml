name: Private products
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build app, core, or publish
        type: string
        required: true
        default: app
      core_ref:
        description: Core branch, tag, or commit SHA
        type: string
        default: main
      app_ref:
        description: App branch, tag, or commit SHA
        type: string
        default: main

permissions:
  contents: read
env:
  CI: 'true'
  API_ORIGIN: ${{ vars.API_ORIGIN }}
  BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
  BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.graph.outputs.selected }}
    steps:
      - &checkout_hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - uses: ./hub
        id: graph
        with:
          operation: plan
          workflow: hub/.github/workflows/private-projects.yml
          target: ${{ inputs.target }}

  core:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    outputs: &artifact_output
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - *checkout_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: your-org/private-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - &setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - &prepare
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ env.BUILDGRAPH_OUTPUT }}
          inputs-directory: ${{ env.BUILDGRAPH_INPUTS }}
          source-directory: ${{ github.workspace }}/source
      - name: Build core
        run: |
          npm ci
          npm run build
          cp -R dist/. "$BUILDGRAPH_OUTPUT/"
      - &pack
        uses: ./hub
        id: pack
        with:
          operation: pack
          directory: ${{ env.BUILDGRAPH_OUTPUT }}
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:${{ github.job }}
      - &upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  app:
    needs: [plan, core]
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'app') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: your-org/private-app
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - *setup_node
      - *prepare
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.core.outputs.artifact_id }}
          path: transfer/core
          digest-mismatch: error
      - uses: ./hub
        with:
          operation: unpack
          archive: transfer/core/output.bgenc
          directory: ${{ env.BUILDGRAPH_INPUTS }}/core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:core
      - name: Build app with core
        run: |
          mkdir -p vendor/core
          cp -R "$BUILDGRAPH_INPUTS/core/." vendor/core/
          npm ci
          npm run build
          cp -R dist/. "$BUILDGRAPH_OUTPUT/"
      - *pack
      - *upload

  publish:
    needs: [plan, app]
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: private-app-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - *checkout_hub
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.app.outputs.artifact_id }}
          path: transfer/app
          digest-mismatch: error
      - uses: ./hub
        with:
          operation: unpack
          archive: transfer/app/output.bgenc
          directory: ${{ env.BUILDGRAPH_INPUTS }}/app
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:app
      - name: Publish to the central repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: app-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          tar -czf "$RUNNER_TEMP/app.tar.gz" -C "$BUILDGRAPH_INPUTS/app" .
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/app.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes "Built by Buildgraph."
