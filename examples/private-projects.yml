name: Private products
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build app, core, or publish
        type: string
        required: true
        default: app
      core_ref:
        description: Core branch, tag, or commit SHA
        type: string
        default: main
      app_ref:
        description: App branch, tag, or commit SHA
        type: string
        default: main

permissions:
  contents: read
env:
  CI: 'true'
  API_ORIGIN: ${{ vars.API_ORIGIN }}
  BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.graph.outputs.selected }}
    steps:
      - &checkout_hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - uses: ./hub/plan
        id: graph
        with:
          workflow: hub/.github/workflows/private-projects.yml
          target: ${{ inputs.target }}

  core:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    outputs: &artifact_output
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - *checkout_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: your-org/private-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - &setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build core
        run: |
          npm ci
          npm run build
      - &upload
        name: Upload encrypted output
        uses: ./hub/upload
        id: upload
        with:
          path: source/dist
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}

  app:
    needs: [plan, core]
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'app') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: your-org/private-app
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - *setup_node
      - uses: ./hub/download
        with:
          artifact-id: ${{ needs.core.outputs.artifact_id }}
          path: ${{ env.BUILDGRAPH_INPUTS }}/core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Build app with core
        run: |
          mkdir -p vendor/core
          cp -R "$BUILDGRAPH_INPUTS/core/." vendor/core/
          npm ci
          npm run build
      - *upload

  publish:
    needs: [plan, app]
    if: ${{ contains(fromJSON(needs.plan.outputs.selected), 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: private-app-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - *checkout_hub
      - uses: ./hub/download
        with:
          artifact-id: ${{ needs.app.outputs.artifact_id }}
          path: ${{ env.BUILDGRAPH_INPUTS }}/app
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Publish to the central repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: app-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          tar -czf "$RUNNER_TEMP/app.tar.gz" -C "$BUILDGRAPH_INPUTS/app" .
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/app.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes "Built by Buildgraph."
