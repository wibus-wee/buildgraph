name: Buildgraph
description: Plan a build DAG and transfer its artifacts between native GitHub Actions jobs
author: wibus-wee
branding:
  icon: git-branch
  color: purple
inputs:
  operation:
    description: plan, prepare, pack, or unpack
    required: true
  manifest:
    description: Path to the graph manifest for plan
  target:
    description: Comma-separated target node IDs
  refs:
    description: JSON object of source ref overrides
    default: '{}'
  expected-digest:
    description: SHA-256 of the manifest used by the compiler
  directory:
    description: Output directory to package, prepare, or restore
  inputs-directory:
    description: Dependency input root for prepare
  source-directory:
    description: Checked-out source directory for commit provenance
  node:
    description: Node ID for prepare
  archive:
    description: Downloaded archive path for unpack
  visibility:
    description: encrypted or public
    default: encrypted
  key:
    description: 64-character hex encryption key; pass from a repository or environment secret
  context:
    description: Authenticated run, manifest, and producer identity for encrypted artifacts
outputs:
  selected:
    description: JSON array of selected nodes including prerequisites
  refs:
    description: JSON object of source refs for selected nodes
  digest:
    description: Manifest SHA-256
  archive:
    description: Absolute path of the packaged output
runs:
  using: node24
  main: dist/action.cjs
