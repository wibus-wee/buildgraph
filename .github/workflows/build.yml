name: Buildgraph demo
run-name: 'Buildgraph demo: ${{ inputs.target }}'
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target job IDs, separated by commas; prerequisites are included
        required: true
        type: string
        default: bundle
      plan_only:
        description: Show the selected jobs without building
        type: boolean
        default: false

permissions:
  contents: read
env:
  BUILD_FLAVOR: demo
  BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
  BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
defaults:
  run:
    shell: bash
    working-directory: hub

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.graph.outputs.selected }}
    steps:
      - &checkout_hub
        name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - uses: ./hub
        id: graph
        with:
          operation: plan
          workflow: hub/.github/workflows/build.yml
          target: ${{ inputs.target }}

  core:
    needs: plan
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: &artifact_output
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - *checkout_hub
      - &prepare
        name: Prepare workspace
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ env.BUILDGRAPH_OUTPUT }}
          inputs-directory: ${{ env.BUILDGRAPH_INPUTS }}
          source-directory: ${{ github.workspace }}/hub
      - name: Build shared core
        run: node examples/demo/build.mjs core
      - &pack_encrypted
        name: Package encrypted output
        uses: ./hub
        id: pack
        with:
          operation: pack
          directory: ${{ env.BUILDGRAPH_OUTPUT }}
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:${{ github.job }}
      - &upload
        name: Upload packaged output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  web:
    needs: [plan, core]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'web') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - *prepare
      - &download_core
        name: Download core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.core.outputs.artifact_id }}
          path: transfer/core
          digest-mismatch: error
      - &restore_core
        name: Restore core
        uses: ./hub
        with:
          operation: unpack
          archive: transfer/core/output.bgenc
          directory: ${{ env.BUILDGRAPH_INPUTS }}/core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:core
      - name: Build web with core
        run: node examples/demo/build.mjs web
      - *pack_encrypted
      - *upload

  cli:
    needs: [plan, core]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'cli') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - *prepare
      - *download_core
      - *restore_core
      - name: Build CLI with core
        run: node examples/demo/build.mjs cli
      - *pack_encrypted
      - *upload

  bundle:
    needs: [plan, web, cli]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'bundle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - *prepare
      - name: Download web
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.web.outputs.artifact_id }}
          path: transfer/web
          digest-mismatch: error
      - name: Restore web
        uses: ./hub
        with:
          operation: unpack
          archive: transfer/web/output.bgenc
          directory: ${{ env.BUILDGRAPH_INPUTS }}/web
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:web
      - name: Download CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact_id }}
          path: transfer/cli
          digest-mismatch: error
      - name: Restore CLI
        uses: ./hub
        with:
          operation: unpack
          archive: transfer/cli/output.bgenc
          directory: ${{ env.BUILDGRAPH_INPUTS }}/cli
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
          context: ${{ github.run_id }}:${{ github.sha }}:cli
      - name: Assemble distributable
        run: node examples/demo/build.mjs bundle
      - &pack_public
        name: Package public output
        uses: ./hub
        id: pack
        with:
          operation: pack
          directory: ${{ env.BUILDGRAPH_OUTPUT }}
          visibility: public
      - *upload

  independent:
    needs: plan
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'independent') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - *prepare
      - name: Independent target
        run: node examples/demo/build.mjs independent
      - *pack_public
      - *upload
