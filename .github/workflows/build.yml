name: Buildgraph demo
run-name: 'Buildgraph demo: ${{ inputs.target }}'
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target job IDs, separated by commas; prerequisites are included
        required: true
        type: string
        default: bundle
      plan_only:
        description: Show the selected jobs without building
        type: boolean
        default: false

permissions:
  contents: read
env:
  BUILD_FLAVOR: demo
  BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
  BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
defaults:
  run:
    shell: bash
    working-directory: hub

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.graph.outputs.selected }}
    steps:
      - &checkout_hub
        name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - uses: ./hub/plan
        id: graph
        with:
          workflow: hub/.github/workflows/build.yml
          target: ${{ inputs.target }}

  core:
    needs: plan
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: &artifact_output
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - *checkout_hub
      - name: Build shared core
        run: node examples/demo/build.mjs core
      - &upload
        name: Upload encrypted output
        uses: ./hub/upload
        id: upload
        with:
          path: ${{ env.BUILDGRAPH_OUTPUT }}
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}

  web:
    needs: [plan, core]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'web') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - &download_core
        name: Download core
        uses: ./hub/download
        with:
          artifact-id: ${{ needs.core.outputs.artifact_id }}
          path: ${{ env.BUILDGRAPH_INPUTS }}/core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Build web with core
        run: node examples/demo/build.mjs web
      - *upload

  cli:
    needs: [plan, core]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'cli') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - *download_core
      - name: Build CLI with core
        run: node examples/demo/build.mjs cli
      - *upload

  bundle:
    needs: [plan, web, cli]
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'bundle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - name: Download web
        uses: ./hub/download
        with:
          artifact-id: ${{ needs.web.outputs.artifact_id }}
          path: ${{ env.BUILDGRAPH_INPUTS }}/web
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Download CLI
        uses: ./hub/download
        with:
          artifact-id: ${{ needs.cli.outputs.artifact_id }}
          path: ${{ env.BUILDGRAPH_INPUTS }}/cli
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Assemble distributable
        run: node examples/demo/build.mjs bundle
      - &upload_public
        name: Upload public output
        uses: ./hub/upload
        id: upload
        with:
          path: ${{ env.BUILDGRAPH_OUTPUT }}
          visibility: public

  independent:
    needs: plan
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'independent') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: *artifact_output
    steps:
      - *checkout_hub
      - name: Independent target
        run: node examples/demo/build.mjs independent
      - *upload_public
