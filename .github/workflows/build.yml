# Generated by Buildgraph from buildgraph.json. Edit the manifest and regenerate.
# Manifest SHA-256: d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6
name: Buildgraph demo
run-name: "Buildgraph demo: ${{ inputs.target }}"
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target node IDs, separated by commas; prerequisites are included
        required: true
        type: string
        default: bundle
      refs:
        description: Optional JSON map of source node IDs to Git refs or commit SHAs
        required: false
        type: string
        default: "{}"
      plan_only:
        description: Validate and show the selected graph without building
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.bg_plan.outputs.selected }}
      refs: ${{ steps.bg_plan.outputs.refs }}
    steps:
      - name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hub
          persist-credentials: false
      - name: Validate and select dependency closure
        uses: ./hub
        with:
          operation: plan
          manifest: hub/buildgraph.json
          target: ${{ inputs.target }}
          refs: ${{ inputs.refs }}
          expected-digest: d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6
        id: bg_plan
  core:
    name: core
    needs:
      - plan
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: hub
    env:
      BUILD_FLAVOR: demo
      BUILDGRAPH_NODE: core
      BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
      BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
      BUILDGRAPH_HUB: ${{ github.workspace }}/hub
    outputs:
      artifact_id: ${{ steps.bg_upload.outputs.artifact-id }}
    steps:
      - name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hub
          persist-credentials: false
      - name: Prepare node workspace
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ github.workspace }}/output
          inputs-directory: ${{ github.workspace }}/inputs
          node: core
          source-directory: ${{ github.workspace }}/hub
      - name: Build shared core
        run: node examples/demo/build.mjs core
      - name: Package node output
        uses: ./hub
        with:
          operation: pack
          directory: ${{ github.workspace }}/output
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
        id: bg_pack
      - name: Upload encrypted output
        id: bg_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: ${{ steps.bg_pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  web:
    name: web
    needs:
      - plan
      - core
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'web') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: hub
    env:
      BUILD_FLAVOR: demo
      BUILDGRAPH_NODE: web
      BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
      BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
      BUILDGRAPH_HUB: ${{ github.workspace }}/hub
    outputs:
      artifact_id: ${{ steps.bg_upload.outputs.artifact-id }}
    steps:
      - name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hub
          persist-credentials: false
      - name: Prepare node workspace
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ github.workspace }}/output
          inputs-directory: ${{ github.workspace }}/inputs
          node: web
          source-directory: ${{ github.workspace }}/hub
      - name: Download core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.core.outputs.artifact_id }}
          path: ${{ github.workspace }}/.buildgraph-transfer/core
          digest-mismatch: error
      - name: Restore core
        uses: ./hub
        with:
          operation: unpack
          archive: ${{ github.workspace }}/.buildgraph-transfer/core/output.bgenc
          directory: ${{ github.workspace }}/inputs/core
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Build web with core
        run: node examples/demo/build.mjs web
      - name: Package node output
        uses: ./hub
        with:
          operation: pack
          directory: ${{ github.workspace }}/output
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:web
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
        id: bg_pack
      - name: Upload encrypted output
        id: bg_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-web
          path: ${{ steps.bg_pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  cli:
    name: cli
    needs:
      - plan
      - core
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'cli') }}
    runs-on: ubuntu-latest
