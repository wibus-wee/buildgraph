      - name: Package node output
        uses: ./hub
        with:
          operation: pack
          directory: ${{ github.workspace }}/output
          visibility: public
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:independent
        id: bg_pack
      - name: Upload public output
        id: bg_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
