    env:
      BUILD_FLAVOR: demo
      BUILDGRAPH_NODE: cli
      BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
      BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
      BUILDGRAPH_HUB: ${{ github.workspace }}/hub
    outputs:
      artifact_id: ${{ steps.bg_upload.outputs.artifact-id }}
    steps:
      - name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hub
          persist-credentials: false
      - name: Prepare node workspace
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ github.workspace }}/output
          inputs-directory: ${{ github.workspace }}/inputs
          node: cli
          source-directory: ${{ github.workspace }}/hub
      - name: Download core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.core.outputs.artifact_id }}
          path: ${{ github.workspace }}/.buildgraph-transfer/core
          digest-mismatch: error
      - name: Restore core
        uses: ./hub
        with:
          operation: unpack
          archive: ${{ github.workspace }}/.buildgraph-transfer/core/output.bgenc
          directory: ${{ github.workspace }}/inputs/core
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:core
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Build CLI with core
        run: node examples/demo/build.mjs cli
      - name: Package node output
        uses: ./hub
        with:
          operation: pack
          directory: ${{ github.workspace }}/output
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:cli
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
        id: bg_pack
      - name: Upload encrypted output
        id: bg_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-cli
          path: ${{ steps.bg_pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  bundle:
    name: bundle
    needs:
      - plan
      - web
      - cli
    if: ${{ !inputs.plan_only && contains(fromJSON(needs.plan.outputs.selected), 'bundle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: hub
    env:
      BUILD_FLAVOR: demo
      BUILDGRAPH_NODE: bundle
      BUILDGRAPH_INPUTS: ${{ github.workspace }}/inputs
      BUILDGRAPH_OUTPUT: ${{ github.workspace }}/output
      BUILDGRAPH_HUB: ${{ github.workspace }}/hub
    outputs:
      artifact_id: ${{ steps.bg_upload.outputs.artifact-id }}
    steps:
      - name: Checkout build hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hub
          persist-credentials: false
      - name: Prepare node workspace
        uses: ./hub
        with:
          operation: prepare
          directory: ${{ github.workspace }}/output
          inputs-directory: ${{ github.workspace }}/inputs
          node: bundle
          source-directory: ${{ github.workspace }}/hub
      - name: Download web
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.web.outputs.artifact_id }}
          path: ${{ github.workspace }}/.buildgraph-transfer/web
          digest-mismatch: error
      - name: Restore web
        uses: ./hub
        with:
          operation: unpack
          archive: ${{ github.workspace }}/.buildgraph-transfer/web/output.bgenc
          directory: ${{ github.workspace }}/inputs/web
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:web
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Download cli
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.cli.outputs.artifact_id }}
          path: ${{ github.workspace }}/.buildgraph-transfer/cli
          digest-mismatch: error
      - name: Restore cli
        uses: ./hub
        with:
          operation: unpack
          archive: ${{ github.workspace }}/.buildgraph-transfer/cli/output.bgenc
          directory: ${{ github.workspace }}/inputs/cli
          visibility: encrypted
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:cli
          key: ${{ secrets.BUILDGRAPH_ARTIFACT_KEY }}
      - name: Assemble distributable
        run: node examples/demo/build.mjs bundle
      - name: Package node output
        uses: ./hub
        with:
          operation: pack
          directory: ${{ github.workspace }}/output
          visibility: public
          context: ${{ github.run_id }}:d69fc37ef3a673b37d6937233b445047e397b8f450cd4710fd81abbc369fc9d6:bundle
        id: bg_pack
      - name: Upload public output
        id: bg_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bg-${{ github.run_id }}-${{ github.run_attempt }}-bundle
          path: ${{ steps.bg_pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  independent:
