name: Buildgraph download
description: Download one artifact from this run or an explicitly trusted remote workflow
inputs:
  artifact-id:
    description: One immutable artifact ID from the producer upload output
    required: true
  path:
    description: Destination directory, which must not already exist
    required: true
  key:
    description: Same 64-character hex secret used by the producer
  visibility:
    description: encrypted or public; must match the producer
    default: encrypted
  source-repository:
    description: Trusted producer owner/repository; omit all source inputs for current-run download
  source-run-id:
    description: Exact producer run ID
  source-workflow:
    description: Trusted producer workflow path, e.g. .github/workflows/build.yml
  source-branch:
    description: Trusted producer branch, e.g. main
  token:
    description: Token with Actions read on the source repository; required for cross-run download
  expected-digest:
    description: Optional SHA-256 digest from the producer upload output
outputs:
  path:
    description: Absolute path of the restored directory
runs:
  using: node24
  main: index.cjs
